<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>myXYZ | Neural Scanner v3.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Syne:wght@500;800&display=swap');

        :root {
            --bg: #050505;
            --surface: #0d0d0d;
            --surface2: #141414;
            --accent: #00ffb3;
            --accent-dim: rgba(0, 255, 179, 0.12);
            --accent-glow: rgba(0, 255, 179, 0.35);
            --danger: #ff3c6e;
            --warn: #ffb800;
            --text: #e0e0e0;
            --text-dim: rgba(224, 224, 224, 0.38);
            --border: rgba(255, 255, 255, 0.07);
            --border-accent: rgba(0, 255, 179, 0.25);
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Syne', sans-serif;
            --blur: blur(25px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --header-h: 60px;
            --footer-h: 90px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: var(--font-mono); font-size: 12px;
            user-select: none; touch-action: none;
        }

        /* ─── LOADER ─── */
        #loader {
            position: fixed; inset: 0; z-index: 1000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader-logo {
            font-family: var(--font-sans); font-size: clamp(52px, 15vw, 72px);
            font-weight: 800; letter-spacing: -3px; margin-bottom: 8px; line-height: 1;
        }
        .loader-logo span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
        .loader-tag { font-size: 10px; color: var(--text-dim); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 48px; }
        .loader-btn {
            padding: 18px 48px; background: transparent; border: 1px solid var(--accent);
            color: var(--accent); font-family: var(--font-mono); font-size: 11px;
            text-transform: uppercase; letter-spacing: 5px; cursor: pointer;
            transition: all 0.3s; border-radius: 4px;
        }

        /* ─── HEADER ─── */
        header {
            position: fixed; top: 0; left: 0; right: 0;
            height: calc(var(--header-h) + var(--safe-top));
            padding: var(--safe-top) 20px 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 5, 0.8); backdrop-filter: var(--blur); z-index: 50;
        }
        .logo { font-family: var(--font-sans); font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }
        .sys-status { display: flex; align-items: center; gap: 8px; font-size: 9px; letter-spacing: 1.5px; opacity: 0.8; }
        .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
        .dot.pulse { animation: pulse 2s infinite; }

        /* ─── CONTAINER ─── */
        #container {
            position: fixed; inset: 0;
            top: calc(var(--header-h) + var(--safe-top));
            bottom: calc(var(--footer-h) + var(--safe-bottom));
        }
        canvas { width: 100%; height: 100%; display: block; }
        video { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

        /* ─── HUD OVERLAYS ─── */
        .scan-frame {
            position: absolute; inset: 40px; border: 1px solid rgba(0, 255, 179, 0.15);
            pointer-events: none; z-index: 5;
        }
        .scan-frame::before, .scan-frame::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            border-color: var(--accent); border-style: solid;
        }
        .scan-frame::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .scan-frame::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        /* ─── TOOLBAR (LEFT) ─── */
        .toolbar {
            position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 12px; z-index: 40;
        }
        .tool-btn {
            width: 44px; height: 44px; border: 1px solid var(--border);
            background: rgba(13,13,13,0.85); color: var(--text-dim);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; backdrop-filter: var(--blur); transition: 0.3s;
        }
        .tool-btn.active { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-dim); }
        .tool-btn svg { width: 20px; height: 20px; }

        /* ─── DEPTH SLIDER (RIGHT) ─── */
        .depth-ctrl {
            position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
            z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .depth-track {
            width: 6px; height: 200px; background: var(--surface2);
            border-radius: 3px; position: relative;
        }
        .depth-fill {
            position: absolute; bottom: 0; width: 100%;
            background: var(--accent); border-radius: 3px;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .depth-handle {
            position: absolute; left: 50%; transform: translate(-50%, 50%);
            width: 32px; height: 32px; background: var(--bg);
            border: 2px solid var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: 700; color: var(--accent);
            touch-action: none;
        }

        /* ─── FOOTER & SNAP ─── */
        footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(var(--footer-h) + var(--safe-bottom));
            padding: 0 20px var(--safe-bottom) 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to top, var(--bg), transparent); z-index: 50;
        }
        .snap-btn-outer {
            width: 72px; height: 72px; border: 2px solid var(--accent);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(0, 255, 179, 0.05);
        }
        .snap-btn-inner {
            width: 58px; height: 58px; background: var(--accent);
            border-radius: 50%; border: none; cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: 0.2s;
        }
        .snap-btn-inner:active { transform: scale(0.85); opacity: 0.8; }
        .snap-btn-inner.scanning { animation: scan-pulse 0.5s infinite; background: var(--warn); }

        .mode-switch {
            background: var(--surface); border: 1px solid var(--border);
            padding: 4px; border-radius: 20px; display: flex; gap: 4px;
        }
        .m-btn {
            padding: 8px 16px; border-radius: 16px; border: none;
            background: transparent; color: var(--text-dim); font-size: 9px;
            font-family: var(--font-mono); font-weight: 700;
        }
        .m-btn.active { background: var(--surface2); color: var(--accent); }

        /* ─── ANIMATIONS ─── */
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } }
        @keyframes scan-pulse { 0% { transform: scale(1); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }
        
        #scanner-line {
            position: fixed; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent); box-shadow: 0 0 15px var(--accent);
            z-index: 60; display: none;
        }

        .toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: var(--bg); padding: 8px 16px;
            border-radius: 4px; font-weight: 700; font-size: 10px; z-index: 100;
            pointer-events: none; opacity: 0; transition: 0.3s;
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="loader-logo">my<span>XYZ</span></div>
    <div class="loader-tag">Tactical Scanning Engine</div>
    <button class="loader-btn" onclick="startApp()">CONNECT</button>
</div>

<header>
    <div class="logo">my<span>XYZ</span></div>
    <div class="sys-status">
        <div class="dot pulse"></div>
        <span id="status-tag">LATENCY: 12ms</span>
    </div>
</header>

<div id="container">
    <div class="scan-frame"></div>
</div>

<div class="toolbar">
    <button class="tool-btn" id="t-heat" onclick="toggleOption('heat')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="10"/></svg></button>
    <button class="tool-btn" id="t-grid" onclick="toggleOption('grid')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
    <button class="tool-btn" id="t-invert" onclick="toggleOption('invert')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"/><path d="M12 18V6"/></svg></button>
</div>

<div class="depth-ctrl">
    <div class="depth-track" id="depth-track">
        <div class="depth-fill" id="depth-fill" style="height: 30%"></div>
        <div class="depth-handle" id="depth-handle" style="bottom: 30%">1.5</div>
    </div>
</div>

<div id="scanner-line"></div>
<div class="toast" id="toast">DATA SYNCHRONIZED</div>

<footer>
    <div class="mode-switch">
        <button class="m-btn active" id="m-live" onclick="setMode('live')">LIVE</button>
        <button class="m-btn" id="m-cloud" onclick="setMode('cloud')">CLOUD</button>
    </div>
    
    <div class="snap-btn-outer">
        <button class="snap-btn-inner" id="snap-trigger" onclick="runScan()"></button>
    </div>

    <button class="tool-btn" onclick="saveData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
</footer>

<video id="v" autoplay playsinline></video>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls, video, videoTex;
let points, cloudPoints;
let config = { depth: 1.5, heat: false, grid: false, invert: false, mode: 'live' };

const _VS = `
    varying vec2 vUv;
    varying float vB;
    uniform sampler2D t;
    uniform float uD;
    void main() {
        vUv = uv;
        vec4 tex = texture2D(t, uv);
        vB = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
        vec3 pos = position;
        pos.z += (vB - 0.5) * uD;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = (1.0 + vB * 3.0);
    }
`;

const _FS = `
    varying vec2 vUv;
    varying float vB;
    uniform sampler2D t;
    uniform bool uH; uniform bool uG; uniform bool uI;
    
    void main() {
        vec4 tex = texture2D(t, vUv);
        vec3 color = tex.rgb;
        if(uI) color = 1.0 - color;
        if(uH) {
            color = mix(vec3(0,0,0.5), vec3(0,1,0.5), vB);
            color = mix(color, vec3(1,0,0), smoothstep(0.6, 1.0, vB));
        }
        if(uG) {
            float g = step(0.95, fract(vUv.x * 40.0)) + step(0.95, fract(vUv.y * 40.0));
            color += g * 0.3;
        }
        gl_FragColor = vec4(color, 1.0);
    }
`;

window.startApp = async () => {
    document.getElementById('loader').style.opacity = 0;
    setTimeout(() => document.getElementById('loader').remove(), 700);

    video = document.getElementById('v');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 640, height: 640 } });
    video.srcObject = stream;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight - 150), 0.1, 1000);
    camera.position.set(0, 0, 8);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('container').appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;
    controls.enableDamping = true;

    videoTex = new THREE.VideoTexture(video);
    const geo = new THREE.PlaneGeometry(10, 10, 256, 256);
    const mat = new THREE.ShaderMaterial({
        uniforms: { t: { value: videoTex }, uD: { value: config.depth }, uH: { value: false }, uG: { value: false }, uI: { value: false } },
        vertexShader: _VS, fragmentShader: _FS
    });

    points = new THREE.Points(geo, mat);
    scene.add(points);

    initInteraction();
    loop();
};

function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
}

// ─── ACTIONS ─────────────────────────────────────────────────────────

window.setMode = (m) => {
    config.mode = m;
    document.querySelectorAll('.m-btn').forEach(b => b.classList.toggle('active', b.id === 'm-'+m));
    controls.enabled = (m === 'cloud');
    
    if(m === 'live') {
        points.visible = true;
        if(cloudPoints) cloudPoints.visible = false;
        camera.position.set(0, 0, 8);
        camera.lookAt(0,0,0);
    } else if(cloudPoints) {
        points.visible = false;
        cloudPoints.visible = true;
    }
};

window.runScan = async () => {
    const btn = document.getElementById('snap-trigger');
    const line = document.getElementById('scanner-line');
    
    btn.classList.add('scanning');
    line.style.display = 'block';
    line.animate([{ top: '0%' }, { top: '100%' }], { duration: 1500, iterations: 1 });

    await new Promise(r => setTimeout(r, 1500));
    
    // Freeze current frame
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const staticTex = new THREE.CanvasTexture(canvas);

    if(cloudPoints) scene.remove(cloudPoints);
    const cloudMat = points.material.clone();
    cloudMat.uniforms.t.value = staticTex;
    cloudPoints = new THREE.Points(points.geometry.clone(), cloudMat);
    scene.add(cloudPoints);

    line.style.display = 'none';
    btn.classList.remove('scanning');
    setMode('cloud');
    notify("VOLUMETRIC DATA STORED");
};

window.toggleOption = (opt) => {
    config[opt] = !config[opt];
    const btn = document.getElementById('t-'+opt);
    btn.classList.toggle('active', config[opt]);
    
    const uniKey = 'u' + opt.charAt(0).toUpperCase();
    points.material.uniforms[uniKey].value = config[opt];
    if(cloudPoints) cloudPoints.material.uniforms[uniKey].value = config[opt];
};

window.saveData = () => {
    const link = document.createElement('a');
    link.download = `SCAN_${Date.now()}.png`;
    link.href = renderer.domElement.toDataURL();
    link.click();
    notify("IMAGE EXPORTED");
};

function notify(text) {
    const t = document.getElementById('toast');
    t.innerText = text;
    t.style.opacity = 1;
    setTimeout(() => t.style.opacity = 0, 2000);
}

// ─── SLIDER LOGIC ───────────────────────────────────────────────────

function initInteraction() {
    const track = document.getElementById('depth-track');
    const handle = document.getElementById('depth-handle');
    const fill = document.getElementById('depth-fill');

    const updateDepth = (e) => {
        const rect = track.getBoundingClientRect();
        const touchY = e.touches ? e.touches[0].clientY : e.clientY;
        let val = 1 - (touchY - rect.top) / rect.height;
        val = Math.max(0, Math.min(1, val));
        
        config.depth = val * 10;
        const percent = val * 100 + '%';
        handle.style.bottom = percent;
        fill.style.height = percent;
        handle.innerText = config.depth.toFixed(1);
        
        points.material.uniforms.uD.value = config.depth;
        if(cloudPoints) cloudPoints.material.uniforms.uD.value = config.depth;
    };

    handle.addEventListener('touchstart', (e) => {
        const move = (me) => { updateDepth(me); me.preventDefault(); };
        const end = () => { window.removeEventListener('touchmove', move); };
        window.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('touchend', end);
    });
}
</script>
</body>
</html>
