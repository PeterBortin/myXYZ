    :root {
        --bg: #050505;
        --surface: #0d0d0d;
        --surface2: #141414;
        --accent: #00ffb3;
        --accent-dim: rgba(0, 255, 179, 0.12);
        --accent-glow: rgba(0, 255, 179, 0.35);
        --danger: #ff3c6e;
        --warn: #ffb800;
        --text: #e0e0e0;
        --text-dim: rgba(224, 224, 224, 0.38);
        --border: rgba(255, 255, 255, 0.07);
        --border-accent: rgba(0, 255, 179, 0.25);
        --font-mono: 'JetBrains Mono', monospace;
        --font-sans: 'Syne', sans-serif;
        --blur: blur(20px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
        --header-h: 56px;
        --footer-h: 88px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
        width: 100%; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: var(--font-mono); font-size: 12px;
        user-select: none; touch-action: none;
    }

    /* ─── LOADER ─── */
    #loader {
        position: fixed; inset: 0; z-index: 1000; background: var(--bg);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .loader-logo {
        font-family: var(--font-sans); font-size: clamp(52px, 15vw, 72px);
        font-weight: 800; letter-spacing: -3px; margin-bottom: 8px; line-height: 1;
    }
    .loader-logo span { color: var(--accent); }
    .loader-tag {
        font-size: 10px; color: var(--text-dim); letter-spacing: 4px;
        text-transform: uppercase; margin-bottom: 48px;
    }
    .loader-btn {
        padding: 16px 52px; background: transparent; border: 1px solid var(--accent);
        color: var(--accent); font-family: var(--font-mono); font-size: 11px;
        text-transform: uppercase; letter-spacing: 5px; cursor: pointer;
        transition: all 0.3s; border-radius: 2px; min-width: 200px;
        min-height: 54px;
    }
    .loader-btn:active { background: var(--accent); color: var(--bg); transform: scale(0.98); }

    /* ─── HEADER ─── */
    header {
        position: fixed; top: 0; left: 0; right: 0;
        height: calc(var(--header-h) + var(--safe-top));
        padding-top: var(--safe-top);
        display: flex; align-items: center; justify-content: space-between;
        padding-left: 16px; padding-right: 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(5, 5, 5, 0.75); backdrop-filter: var(--blur); z-index: 20;
    }
    .logo { font-family: var(--font-sans); font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }

    .sys-status { display: flex; align-items: center; gap: 8px; font-size: 9px; letter-spacing: 2px; }
    .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px var(--accent); }
    .dot.pulse { animation: pulse 2s infinite; }
    .dot.busy { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 0.6s infinite; }
    .dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    .meta-info { font-size: 9px; color: var(--text-dim); text-align: right; line-height: 1.6; }

    /* ─── THREE.JS CANVAS ─── */
    #container {
        position: fixed;
        top: calc(var(--header-h) + var(--safe-top));
        left: 0; right: 0;
        bottom: calc(var(--footer-h) + var(--safe-bottom));
    }
    #container canvas { width: 100% !important; height: 100% !important; }

    video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    /* ─── TOOLBAR (bottom-left floats) ─── */
    .toolbar {
        position: fixed;
        left: 12px;
        bottom: calc(var(--footer-h) + var(--safe-bottom) + 12px);
        display: flex; flex-direction: column; gap: 8px; z-index: 15;
    }
    .tool-btn {
        width: 44px; height: 44px; border: 1px solid var(--border);
        background: rgba(13,13,13,0.85); color: var(--text-dim);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        border-radius: 8px; transition: all 0.2s; backdrop-filter: var(--blur);
        position: relative;
    }
    .tool-btn:active { transform: scale(0.92); }
    .tool-btn.active { color: var(--accent); border-color: var(--border-accent); background: var(--accent-dim); }
    .tool-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .badge {
        position: absolute; top: -4px; right: -4px; width: 10px; height: 10px;
        background: var(--accent); border-radius: 50%; border: 2px solid var(--bg);
        display: none;
    }
    .badge.visible { display: block; }

    /* ─── DEPTH CONTROL ─── */
    .depth-ctrl {
        position: fixed; right: 12px;
        bottom: calc(var(--footer-h) + var(--safe-bottom) + 12px);
        z-index: 15;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .depth-label { font-size: 8px; color: var(--text-dim); letter-spacing: 2px; writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); }
    .depth-track {
        width: 32px; height: 120px;
        background: rgba(13,13,13,0.85); border: 1px solid var(--border);
        border-radius: 16px; backdrop-filter: var(--blur);
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: visible; touch-action: none;
    }
    input[type=range].vert {
        -webkit-appearance: none;
        writing-mode: vertical-lr;
        direction: rtl;
        width: 100px; height: 4px;
        background: transparent; outline: none; cursor: pointer;
    }
    input[type=range].vert::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 22px; height: 22px;
        background: var(--accent);
        border-radius: 50%; cursor: pointer;
        box-shadow: 0 0 12px var(--accent-glow);
    }
    input[type=range].vert::-webkit-slider-runnable-track { background: var(--border); width: 3px; border-radius: 2px; }
    .depth-val { font-size: 9px; color: var(--accent); letter-spacing: 1px; }

    /* ─── FOOTER / FAB ─── */
    footer {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: calc(var(--footer-h) + var(--safe-bottom));
        padding-bottom: var(--safe-bottom);
        display: flex; align-items: center; justify-content: space-between;
        padding-left: 16px; padding-right: 16px;
        border-top: 1px solid var(--border);
        background: rgba(5, 5, 5, 0.85); backdrop-filter: var(--blur); z-index: 20;
    }
    .snap-btn {
        flex: 1; max-width: 220px; height: 52px; margin: 0 auto;
        background: var(--accent); color: var(--bg);
        border: none; border-radius: 26px; font-family: var(--font-mono);
        font-weight: 700; font-size: 11px; letter-spacing: 3px;
        cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden;
    }
    .snap-btn::after {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.25) 0%, transparent 60%);
        opacity: 0; transition: opacity 0.3s;
    }
    .snap-btn:active { transform: scale(0.97); box-shadow: 0 0 30px var(--accent-glow); }
    .snap-btn:active::after { opacity: 1; }
    .snap-btn.scanning {
        background: var(--warn); pointer-events: none;
        animation: scanPulse 0.5s infinite alternate;
    }
    @keyframes scanPulse { from { box-shadow: 0 0 10px var(--warn); } to { box-shadow: 0 0 35px var(--warn); } }

    .footer-action {
        width: 44px; height: 44px; border: 1px solid var(--border);
        background: transparent; color: var(--text-dim);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        border-radius: 8px; transition: all 0.2s;
    }
    .footer-action:active { transform: scale(0.92); background: var(--accent-dim); color: var(--accent); }
    .footer-action svg { width: 18px; height: 18px; }

    /* ─── MODE SWITCHER ─── */
    .mode-pill {
        position: fixed;
        top: calc(var(--header-h) + var(--safe-top) + 12px);
        left: 50%; transform: translateX(-50%);
        display: flex; background: rgba(13,13,13,0.9);
        border: 1px solid var(--border); border-radius: 20px;
        backdrop-filter: var(--blur); z-index: 15; overflow: hidden;
    }
    .mode-btn {
        padding: 8px 20px; font-size: 9px; letter-spacing: 2px;
        text-transform: uppercase; background: transparent; color: var(--text-dim);
        border: none; cursor: pointer; transition: all 0.25s; min-height: 36px;
        white-space: nowrap;
    }
    .mode-btn.active { background: var(--accent-dim); color: var(--accent); }

    /* ─── BOTTOM SHEET (AI panel) ─── */
    .sheet-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        z-index: 30; opacity: 0; pointer-events: none;
        transition: opacity 0.35s; backdrop-filter: blur(4px);
    }
    .sheet-overlay.open { opacity: 1; pointer-events: all; }

    .bottom-sheet {
        position: fixed; bottom: 0; left: 0; right: 0;
        max-height: 80vh; background: var(--surface);
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0; z-index: 40;
        transform: translateY(100%);
        transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        padding-bottom: var(--safe-bottom);
        display: flex; flex-direction: column;
    }
    .bottom-sheet.open { transform: translateY(0); }

    .sheet-handle {
        width: 36px; height: 4px; background: var(--border);
        border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
    }
    .sheet-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px 12px; flex-shrink: 0;
        border-bottom: 1px solid var(--border);
    }
    .sheet-title { font-family: var(--font-sans); font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
    .sheet-close {
        width: 32px; height: 32px; border: 1px solid var(--border);
        background: transparent; color: var(--text-dim); border-radius: 6px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .sheet-close svg { width: 16px; height: 16px; }
    .sheet-body { overflow-y: auto; padding: 16px 20px; flex: 1; -webkit-overflow-scrolling: touch; }

    /* AI Cards */
    .ai-card {
        background: var(--surface2); padding: 14px 16px;
        border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border);
    }
    .ai-card label { display: block; font-size: 8px; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 2px; }
    .ai-card p { font-size: 11px; line-height: 1.65; color: var(--text); }
    .ai-card.loading p { color: var(--text-dim); }

    .ai-thinking {
        display: flex; gap: 5px; align-items: center; padding: 8px 0;
    }
    .ai-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: aiThink 1.2s infinite; }
    .ai-dot:nth-child(2) { animation-delay: 0.2s; }
    .ai-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes aiThink { 0%,80%,100% { transform: scale(0.6); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

    /* Measure mode */
    .measure-points {
        position: fixed; left: 50%; transform: translateX(-50%);
        top: calc(var(--header-h) + var(--safe-top) + 60px);
        background: rgba(13,13,13,0.9); border: 1px solid var(--border-accent);
        border-radius: 8px; padding: 8px 16px;
        font-size: 10px; color: var(--accent); letter-spacing: 2px;
        z-index: 15; display: none; text-align: center;
        backdrop-filter: var(--blur);
    }
    .measure-points.visible { display: block; }

    /* ─── SCAN OVERLAY ─── */
    #scanner {
        position: fixed;
        top: calc(var(--header-h) + var(--safe-top));
        left: 0; right: 0;
        bottom: calc(var(--footer-h) + var(--safe-bottom));
        border: 2px solid var(--accent);
        pointer-events: none; display: none; z-index: 25;
        overflow: hidden;
    }
    .scan-line {
        position: absolute; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        box-shadow: 0 0 12px var(--accent-glow);
        animation: scanLine 1s linear infinite;
    }
    .scan-corner { position: absolute; width: 20px; height: 20px; border-color: var(--accent); border-style: solid; }
    .scan-corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .scan-corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
    .scan-corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
    .scan-corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }
    .scan-progress { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--accent); letter-spacing: 3px; }
    @keyframes scanLine { from { top: 0; } to { top: 100%; } }

    /* ─── NOTIFICATIONS ─── */
    #notifications {
        position: fixed; top: calc(var(--header-h) + var(--safe-top) + 8px);
        left: 50%; transform: translateX(-50%);
        z-index: 50; display: flex; flex-direction: column; gap: 6px; width: min(320px, 90vw);
        pointer-events: none;
    }
    .toast {
        background: var(--surface); border-left: 2px solid var(--accent);
        padding: 11px 14px; font-size: 10px; letter-spacing: 1px;
        border-radius: 6px;
        animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6); pointer-events: none;
        display: flex; align-items: center; gap: 8px;
    }
    .toast-icon { width: 16px; height: 16px; flex-shrink: 0; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ─── GESTURE HINT ─── */
    .gesture-hint {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: calc(var(--footer-h) + var(--safe-bottom) + 12px);
        font-size: 9px; color: var(--text-dim); letter-spacing: 2px;
        pointer-events: none; transition: opacity 0.5s; z-index: 14;
        text-transform: uppercase; white-space: nowrap;
    }

    /* ─── MULTI-FRAME PANEL ─── */
    .frames-strip {
        position: fixed;
        top: calc(var(--header-h) + var(--safe-top) + 12px);
        right: 12px; display: flex; flex-direction: column; gap: 6px;
        z-index: 15;
    }
    .frame-thumb {
        width: 48px; height: 36px;
        border: 1px solid var(--border); border-radius: 4px;
        background: var(--surface); overflow: hidden; cursor: pointer;
        transition: border-color 0.2s; position: relative;
    }
    .frame-thumb.active { border-color: var(--accent); }
    .frame-thumb canvas { width: 100%; height: 100%; object-fit: cover; }
    .frame-thumb .frame-num {
        position: absolute; bottom: 2px; right: 4px;
        font-size: 8px; color: var(--accent); line-height: 1;
    }

    /* ─── POINT INFO ─── */
    .point-popup {
        position: fixed; background: rgba(13,13,13,0.95);
        border: 1px solid var(--border-accent); border-radius: 6px;
        padding: 8px 12px; font-size: 9px; color: var(--accent);
        letter-spacing: 1px; pointer-events: none; z-index: 20;
        display: none; line-height: 1.6;
    }

    .hidden { display: none !important; }

    /* ─── RESPONSIVE ─── */
    @media (orientation: landscape) and (max-height: 500px) {
        :root { --header-h: 44px; --footer-h: 64px; }
        .mode-pill { display: none; }
        .depth-track { height: 80px; }
    }
    @media (min-width: 768px) {
        :root { --header-h: 60px; --footer-h: 80px; }
        .toolbar { left: 20px; }
        .depth-ctrl { right: 20px; }
    }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
    mode: 'live',
    depth: 1.5,
    heatmap: false,
    wireframe: false,
    aiOpen: false,
    hasSnap: false,
    gridSize: 400,
    multiMode: false,
    frames: [],          // [{canvas, tex}]
    activeFrame: -1,
    measurePts: [],
    lastAiResult: null,
};

let scene, camera, renderer, controls, video, videoTex;
let liveMesh, snapMesh;
let fpsFrames = 0, lastFpsTime = 0;
let measureMarkers = [];
let pinchStartDist = 0, pinchStartDepth = 0;
let swipeStartX = 0, swipeStartY = 0;
const MODES = ['live','view','measure'];

// ─── INIT ────────────────────────────────────────────────────────────────────
window.initApp = async () => {
    const loader = document.getElementById('loader');
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 700);

    try {
        await initCamera();
        initThree();
        createLiveMesh();
        initGestures();
        animate();
        updateStatus('ЭФИР', false);
        showToast('Система активирована', 'success');
    } catch(e) {
        loader.style.opacity = '1';
        loader.style.display = 'flex';
        showToast('Нет доступа к камере', 'danger');
        console.error(e);
    }
};

async function initCamera() {
    video = document.getElementById('vid');
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    return new Promise(r => video.onloadedmetadata = r);
}

function initThree() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, getAR(), 0.1, 1000);
    camera.position.z = 5;

    const el = document.getElementById('container');
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(el.clientWidth, el.clientHeight);
    renderer.setClearColor(0x000000, 0);
    el.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enabled = false;
    controls.enablePan = true;

    videoTex = new THREE.VideoTexture(video);
    videoTex.minFilter = THREE.LinearFilter;

    window.addEventListener('resize', onResize);
    onResize();
}

function getAR() {
    const el = document.getElementById('container');
    return el.clientWidth / el.clientHeight;
}
function onResize() {
    const el = document.getElementById('container');
    camera.aspect = getAR();
    camera.updateProjectionMatrix();
    renderer.setSize(el.clientWidth, el.clientHeight);
}

// ─── SHADERS ─────────────────────────────────────────────────────────────────
const vertShader = `
    varying vec2 vUv;
    varying float vDepth;
    uniform sampler2D tDiffuse;
    uniform float uDepth;
    uniform float uTime;
    void main() {
        vUv = uv;
        vec4 tex = texture2D(tDiffuse, uv);
        float lum = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
        vDepth = lum;
        vec3 pos = position;
        pos.z += (lum - 0.5) * uDepth;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = clamp(1800.0 / length((modelViewMatrix * vec4(pos,1.0)).xyz), 1.0, 4.0);
    }
`;
const fragShader = `
    varying vec2 vUv;
    varying float vDepth;
    uniform sampler2D tDiffuse;
    uniform bool uHeatmap;
    uniform bool uWire;
    vec3 heat(float v) {
        vec3 c0 = vec3(0.0, 0.4, 1.0);
        vec3 c1 = vec3(0.0, 1.0, 0.4);
        vec3 c2 = vec3(1.0, 0.8, 0.0);
        vec3 c3 = vec3(1.0, 0.1, 0.2);
        if(v < 0.33) return mix(c0, c1, v * 3.0);
        if(v < 0.66) return mix(c1, c2, (v - 0.33) * 3.0);
        return mix(c2, c3, (v - 0.66) * 3.0);
    }
    void main() {
        vec4 c = texture2D(tDiffuse, vUv);
        if(uHeatmap) {
            gl_FragColor = vec4(heat(vDepth), 0.9);
        } else if(uWire) {
            float edge = max(abs(vUv.x - 0.5), abs(vUv.y - 0.5));
            float wire = step(0.48, edge) * 0.5;
            gl_FragColor = mix(c, vec4(0.0, 1.0, 0.7, 1.0), wire);
        } else {
            gl_FragColor = vec4(c.rgb, 0.88);
        }
    }
`;

function makeUniforms(tex) {
    return {
        tDiffuse: { value: tex },
        uDepth: { value: S.depth },
        uHeatmap: { value: S.heatmap },
        uWire: { value: S.wireframe },
        uTime: { value: 0 }
    };
}
function makeGeo() {
    return new THREE.PlaneGeometry(7, 4.7, S.gridSize, S.gridSize);
}

function createLiveMesh() {
    const mat = new THREE.ShaderMaterial({
        uniforms: makeUniforms(videoTex),
        vertexShader: vertShader, fragmentShader: fragShader, transparent: true
    });
    liveMesh = new THREE.Points(makeGeo(), mat);
    scene.add(liveMesh);
    const cnt = (S.gridSize + 1) * (S.gridSize + 1);
    document.getElementById('pts-val').textContent = (cnt / 1000).toFixed(0);
}

// ─── ANIMATE ─────────────────────────────────────────────────────────────────
function animate() {
    requestAnimationFrame(animate);
    controls.update();

    if (liveMesh?.visible) {
        liveMesh.material.uniforms.tDiffuse.value = videoTex;
        liveMesh.material.uniforms.uTime.value = performance.now() * 0.001;
    }

    renderer.render(scene, camera);

    fpsFrames++;
    const now = performance.now();
    if (now - lastFpsTime > 1000) {
        document.getElementById('fps-val').textContent = fpsFrames;
        fpsFrames = 0; lastFpsTime = now;
    }
}

// ─── MODE ─────────────────────────────────────────────────────────────────────
window.setMode = (m) => {
    if (m === 'view' && !S.hasSnap) {
        showToast('Сначала сделайте захват', 'warn');
        return;
    }
    if (m === 'measure' && !S.hasSnap) {
        showToast('Нужен захват для измерений', 'warn');
        return;
    }
    S.mode = m;
    MODES.forEach(id => document.getElementById('mode-' + id)?.classList.remove('active'));
    document.getElementById('mode-' + m)?.classList.add('active');

    const liveVis = m === 'live';
    const snapVis = (m === 'view' || m === 'measure') && S.hasSnap;
    if (liveMesh) liveMesh.visible = liveVis;
    if (snapMesh) snapMesh.visible = snapVis;

    controls.enabled = (m === 'view');
    document.getElementById('measure-hint').classList.toggle('visible', m === 'measure');

    if (m !== 'measure') clearMeasureMarkers();
    if (m === 'live') { camera.position.set(0,0,5); camera.lookAt(0,0,0); }
    updateStatus(m === 'live' ? 'ЭФИР' : m === 'view' ? '3D АНАЛИЗ' : 'ИЗМЕРЕНИЕ', false);
};

// ─── DEPTH ────────────────────────────────────────────────────────────────────
window.updateDepth = (v) => {
    S.depth = parseFloat(v);
    document.getElementById('depth-val').textContent = parseFloat(v).toFixed(1);
    if (liveMesh) liveMesh.material.uniforms.uDepth.value = S.depth;
    if (snapMesh) snapMesh.material.uniforms.uDepth.value = S.depth;
};

// ─── HEATMAP ─────────────────────────────────────────────────────────────────
window.toggleHeatmap = () => {
    S.heatmap = !S.heatmap;
    [liveMesh, snapMesh].forEach(m => { if(m) m.material.uniforms.uHeatmap.value = S.heatmap; });
    document.getElementById('btn-heat').classList.toggle('active', S.heatmap);
    showToast(S.heatmap ? 'Тепловая карта' : 'RGB режим', 'info');
};

// ─── WIREFRAME ────────────────────────────────────────────────────────────────
window.toggleWireframe = () => {
    S.wireframe = !S.wireframe;
    [liveMesh, snapMesh].forEach(m => { if(m) m.material.uniforms.uWire.value = S.wireframe; });
    document.getElementById('btn-wire').classList.toggle('active', S.wireframe);
};

// ─── SNAPSHOT ─────────────────────────────────────────────────────────────────
window.takeSnapshot = async () => {
    const btn = document.getElementById('snap-btn');
    const scanner = document.getElementById('scanner');
    btn.classList.add('scanning');
    btn.textContent = 'СКАНИРОВАНИЕ...';
    scanner.style.display = 'block';
    updateStatus('СКАНИРОВАНИЕ', true);

    // progress animation
    let pct = 0;
    const pEl = document.getElementById('scan-progress');
    const pTimer = setInterval(() => {
        pct = Math.min(pct + 5, 98);
        pEl.textContent = `СКАНИРОВАНИЕ ${pct}%`;
    }, 60);

    await sleep(1300);
    clearInterval(pTimer);
    pEl.textContent = 'СКАНИРОВАНИЕ 100%';
    await sleep(200);

    scanner.style.display = 'none';
    btn.classList.remove('scanning');
    btn.textContent = 'ЗАХВАТ ОБЪЁМА';

    const snap = captureVideoFrame();

    if (S.multiMode) {
        addMultiFrame(snap);
    } else {
        buildSnap(snap.tex, snap.canvas);
    }

    S.hasSnap = true;
    document.getElementById('export-btn').disabled = false;
    setMode('view');
    showToast('Объём захвачен', 'success');
    runAiAnalysis(snap.canvas);
};

function captureVideoFrame() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    canvas.getContext('2d').drawImage(video, 0, 0, 1024, 1024);
    const tex = new THREE.CanvasTexture(canvas);
    return { canvas, tex };
}

function buildSnap(tex, srcCanvas) {
    if (snapMesh) { scene.remove(snapMesh); snapMesh.geometry.dispose(); snapMesh.material.dispose(); }
    const mat = new THREE.ShaderMaterial({
        uniforms: makeUniforms(tex),
        vertexShader: vertShader, fragmentShader: fragShader, transparent: true
    });
    snapMesh = new THREE.Points(makeGeo(), mat);
    scene.add(snapMesh);
    snapMesh.visible = false;

    // Store buffer canvas for export
    const buf = document.getElementById('buffer-canvas');
    buf.width = 1024; buf.height = 1024;
    buf.getContext('2d').drawImage(srcCanvas, 0, 0);
}

// ─── MULTI-FRAME ──────────────────────────────────────────────────────────────
window.toggleMultiframe = () => {
    S.multiMode = !S.multiMode;
    document.getElementById('btn-multi').classList.toggle('active', S.multiMode);
    const strip = document.getElementById('frames-strip');
    strip.classList.toggle('hidden', !S.multiMode);
    if (S.multiMode) showToast('Мультифрейм ON — до 3 снимков', 'info');
    else { S.frames = []; strip.innerHTML = ''; showToast('Мультифрейм OFF', 'info'); }
};

function addMultiFrame(snap) {
    if (S.frames.length >= 3) { S.frames.shift(); }
    S.frames.push(snap);
    renderFrameStrip();

    if (S.frames.length >= 2) {
        const merged = mergeFrames(S.frames);
        buildSnap(merged.tex, merged.canvas);
    } else {
        buildSnap(snap.tex, snap.canvas);
    }
}

function mergeFrames(frames) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    ctx.globalAlpha = 1 / frames.length;
    frames.forEach(f => ctx.drawImage(f.canvas, 0, 0));
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(canvas);
    return { canvas, tex };
}

function renderFrameStrip() {
    const strip = document.getElementById('frames-strip');
    strip.innerHTML = '';
    S.frames.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'frame-thumb';
        const c = document.createElement('canvas');
        c.width = 96; c.height = 72;
        c.getContext('2d').drawImage(f.canvas, 0, 0, 96, 72);
        const num = document.createElement('div');
        num.className = 'frame-num';
        num.textContent = i + 1;
        div.appendChild(c); div.appendChild(num);
        div.onclick = () => selectFrame(i);
        strip.appendChild(div);
    });
}

function selectFrame(i) {
    S.activeFrame = i;
    buildSnap(S.frames[i].tex, S.frames[i].canvas);
    setMode('view');
}

// ─── MEASURE MODE ─────────────────────────────────────────────────────────────
function onCanvasTap(e) {
    if (S.mode !== 'measure') return;
    e.preventDefault();
    const touch = e.touches?.[0] || e;
    const rect = renderer.domElement.getBoundingClientRect();
    const nx = (touch.clientX - rect.left) / rect.width * 2 - 1;
    const ny = -((touch.clientY - rect.top) / rect.height) * 2 + 1;

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
    raycaster.params.Points.threshold = 0.1;

    const targets = [snapMesh].filter(Boolean);
    const hits = raycaster.intersectObjects(targets);
    if (!hits.length) return;

    const pt = hits[0].point.clone();
    addMeasureMarker(pt, touch.clientX, touch.clientY);
}

function addMeasureMarker(pt3d, cx, cy) {
    const geo = new THREE.SphereGeometry(0.04, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ffb3 });
    const sphere = new THREE.Mesh(geo, mat);
    sphere.position.copy(pt3d);
    scene.add(sphere);
    measureMarkers.push({ mesh: sphere, pos: pt3d });

    const hint = document.getElementById('measure-hint');

    if (measureMarkers.length === 1) {
        hint.textContent = 'ТАП ДЛЯ ТОЧКИ Б';
        showToast('Точка A установлена', 'info');
    } else if (measureMarkers.length === 2) {
        const a = measureMarkers[0].pos;
        const b = measureMarkers[1].pos;
        const dist = a.distanceTo(b).toFixed(3);

        // Draw line
        const linGeo = new THREE.BufferGeometry().setFromPoints([a, b]);
        const linMat = new THREE.LineBasicMaterial({ color: 0x00ffb3 });
        const line = new THREE.Line(linGeo, linMat);
        scene.add(line);
        measureMarkers.push({ mesh: line, pos: null });

        showPopup(cx, cy, `DIST: ${dist} ед.\nA→B`);
        showToast(`Расстояние: ${dist} ед.`, 'success');
        hint.textContent = 'ТАП СБРАСЫВАЕТ ЗАМЕР';
    } else {
        clearMeasureMarkers();
        hint.textContent = 'ТАП ДЛЯ ТОЧКИ А';
        document.getElementById('point-popup').style.display = 'none';
    }
}

function clearMeasureMarkers() {
    measureMarkers.forEach(m => { scene.remove(m.mesh); m.mesh.geometry?.dispose(); m.mesh.material?.dispose(); });
    measureMarkers = [];
}

function showPopup(x, y, text) {
    const el = document.getElementById('point-popup');
    el.style.display = 'block';
    el.style.left = Math.min(x + 12, window.innerWidth - 140) + 'px';
    el.style.top = Math.max(y - 60, 80) + 'px';
    el.innerText = text;
}

// ─── GESTURES ─────────────────────────────────────────────────────────────────
function initGestures() {
    const cvs = renderer.domElement;

    cvs.addEventListener('touchstart', onTouchStart, { passive: false });
    cvs.addEventListener('touchmove', onTouchMove, { passive: false });
    cvs.addEventListener('touchend', onTouchEnd, { passive: false });
    cvs.addEventListener('click', onCanvasTap, false);
    cvs.addEventListener('touchend', (e) => { if (e.changedTouches.length === 1) onCanvasTap(e.changedTouches[0]); }, { passive: false });
}

function onTouchStart(e) {
    if (e.touches.length === 2) {
        pinchStartDist = getPinchDist(e);
        pinchStartDepth = S.depth;
    } else if (e.touches.length === 1) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
    }
}

function onTouchMove(e) {
    if (e.touches.length === 2) {
        e.preventDefault();
        const d = getPinchDist(e);
        const ratio = d / pinchStartDist;
        const newDepth = Math.max(0.3, Math.min(10, pinchStartDepth * ratio));
        document.getElementById('depth-slider').value = newDepth;
        updateDepth(newDepth);
    }
}

function onTouchEnd(e) {
    if (e.changedTouches.length === 1 && S.mode === 'live') {
        const dx = e.changedTouches[0].clientX - swipeStartX;
        const dy = e.changedTouches[0].clientY - swipeStartY;
        if (Math.abs(dx) > 60 && Math.abs(dy) < 40) {
            const idx = MODES.indexOf(S.mode);
            const next = MODES[(idx + (dx < 0 ? 1 : -1) + MODES.length) % MODES.length];
            setMode(next);
        }
    }
}

function getPinchDist(e) {
    const t = e.touches;
    return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}

// ─── AI ANALYSIS ──────────────────────────────────────────────────────────────
async function runAiAnalysis(canvas) {
    if (!S.aiOpen) toggleAiSheet();
    const body = document.getElementById('ai-body');
    body.innerHTML = `<div class="ai-card loading">
        <label>Нейросеть думает</label>
        <div class="ai-thinking"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>
    </div>`;

    try {
        const b64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [{
                    role: 'user',
                    content: [
                        {
                            type: 'image',
                            source: { type: 'base64', media_type: 'image/jpeg', data: b64 }
                        },
                        {
                            type: 'text',
                            text: `Ты — система компьютерного зрения для 3D-сканера. Проанализируй это изображение с камеры, которое используется как текстура для облака точек (volumetric point cloud). 
Ответь СТРОГО в формате JSON (без маркдауна), вот схема:
{
  "object": "краткое название объекта или сцены",
  "geometry": "оценка геометрии: flat/moderate/complex (1 слово)",
  "dominant_colors": ["цвет1", "цвет2"],
  "depth_quality": "оценка качества глубины от 0 до 100 как число",
  "lighting": "оценка освещения: poor/ok/good (1 слово)",
  "tips": ["совет 1 на русском", "совет 2 на русском"],
  "scene_description": "2-3 предложения описания на русском"
}
Отвечай только JSON, без пояснений.`
                        }
                    ]
                }]
            })
        });

        const data = await resp.json();
        const raw = data.content?.find(c => c.type === 'text')?.text || '{}';
        let ai;
        try { ai = JSON.parse(raw.replace(/```json|```/g, '').trim()); }
        catch { ai = null; }

        if (ai) {
            S.lastAiResult = ai;
            document.getElementById('ai-badge').classList.add('visible');
            renderAiCards(ai);
        } else {
            renderAiFallback((S.gridSize + 1) ** 2);
        }
    } catch(err) {
        renderAiFallback((S.gridSize + 1) ** 2);
        console.warn('AI fetch failed:', err);
    }
}

function renderAiCards(ai) {
    const depthBar = `<div style="height:4px;background:var(--border);border-radius:2px;margin-top:8px">
        <div style="height:4px;width:${ai.depth_quality}%;background:var(--accent);border-radius:2px;transition:width 1s"></div>
    </div>`;
    const colorDots = (ai.dominant_colors || []).map(c =>
        `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:4px;border:1px solid var(--border)"></span>`
    ).join('');

    document.getElementById('ai-body').innerHTML = `
        <div class="ai-card">
            <label>Объект</label>
            <p>${ai.object || '—'}</p>
        </div>
        <div class="ai-card">
            <label>Описание сцены</label>
            <p>${ai.scene_description || '—'}</p>
        </div>
        <div class="ai-card">
            <label>Геометрия</label>
            <p>Сложность: <strong style="color:var(--accent)">${ai.geometry || '—'}</strong> · Освещение: <strong style="color:var(--accent)">${ai.lighting || '—'}</strong></p>
        </div>
        <div class="ai-card">
            <label>Цветовой профиль</label>
            <p>${colorDots}</p>
        </div>
        <div class="ai-card">
            <label>Качество глубины · ${ai.depth_quality}%</label>
            ${depthBar}
        </div>
        <div class="ai-card">
            <label>Рекомендации AI</label>
            <p>${(ai.tips || []).map((t,i) => `${i+1}. ${t}`).join('<br>')}</p>
        </div>
        <div class="ai-card">
            <label>Точек в облаке</label>
            <p>${((S.gridSize + 1) ** 2 / 1000).toFixed(0)}K векторов</p>
        </div>
    `;
}

function renderAiFallback(pts) {
    document.getElementById('ai-body').innerHTML = `
        <div class="ai-card">
            <label>Точек в облаке</label>
            <p>${(pts / 1000).toFixed(0)}K активных векторов</p>
        </div>
        <div class="ai-card">
            <label>Топология</label>
            <p>Сложность: ${(Math.random() * 25 + 65).toFixed(1)}% · Рельеф стабилен</p>
        </div>
        <div class="ai-card">
            <label>Совет</label>
            <p>Увеличьте ГЛУБИНУ для акцентирования рельефа. Используйте тепловую карту для анализа контуров.</p>
        </div>
    `;
}

// ─── AI SHEET ─────────────────────────────────────────────────────────────────
window.toggleAiSheet = () => {
    S.aiOpen = !S.aiOpen;
    document.getElementById('ai-sheet').classList.toggle('open', S.aiOpen);
    document.getElementById('sheet-overlay').classList.toggle('open', S.aiOpen);
    document.getElementById('btn-ai').classList.toggle('active', S.aiOpen);
};
window.closeAiSheet = () => {
    S.aiOpen = false;
    document.getElementById('ai-sheet').classList.remove('open');
    document.getElementById('sheet-overlay').classList.remove('open');
    document.getElementById('btn-ai').classList.remove('active');
};

// ─── EXPORT ───────────────────────────────────────────────────────────────────
window.exportData = () => {
    renderer.render(scene, camera);
    const url = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.download = `myXYZ_${Date.now()}.png`;
    a.href = url; a.click();
    showToast('Снимок сохранён', 'success');
};

// ─── RESET ────────────────────────────────────────────────────────────────────
window.resetSystem = () => {
    if (!confirm('Сбросить систему? Все сканы удалятся.')) return;
    location.reload();
};

// ─── UTILS ────────────────────────────────────────────────────────────────────
function updateStatus(txt, busy) {
    document.getElementById('status-text').textContent = txt;
    const d = document.getElementById('status-dot');
    d.className = busy ? 'dot busy' : 'dot pulse';
}

function showToast(msg, type) {
    const icons = {
        success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
        danger: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
        warn: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
        info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
    };
    const cont = document.getElementById('notifications');
    const t = document.createElement('div');
    t.className = 'toast';
    if (type === 'danger') t.style.borderColor = 'var(--danger)';
    if (type === 'warn') t.style.borderColor = 'var(--warn)';
    t.innerHTML = (icons[type] || icons.info) + msg;
    cont.appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity 0.4s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3000);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ─── SHEET SWIPE TO CLOSE ─────────────────────────────────────────────────────
let sheetStartY = 0;
const sheet = document.getElementById('ai-sheet');
sheet.addEventListener('touchstart', e => { sheetStartY = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - sheetStartY;
    if (dy > 80) closeAiSheet();
}, { passive: true });

</script>
