<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>myXYZ | PRO Scanner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Syne:wght@800&display=swap');

        :root {
            --bg: #030303;
            --accent: #00ffb3;
            --accent-dim: rgba(0, 255, 179, 0.15);
            --danger: #ff3c6e;
            --text: #e0e0e0;
            --border: rgba(255, 255, 255, 0.1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
        }

        /* ─── UI ELEMENTS ─── */
        #loader {
            position: fixed; inset: 0; z-index: 1000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader-logo { font-family: 'Syne', sans-serif; font-size: 64px; font-weight: 800; }
        .loader-logo span { color: var(--accent); }

        header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: calc(var(--safe-top) + 15px) 20px 15px;
            display: flex; align-items: flex-start; justify-content: space-between;
            z-index: 50; pointer-events: none;
        }
        .sys-log { line-height: 1.4; opacity: 0.6; text-transform: uppercase; font-size: 9px; }

        /* ─── CANVAS ─── */
        #container { position: fixed; inset: 0; background: #000; }
        video { position: absolute; opacity: 0; pointer-events: none; }

        /* ─── CONTROLS ─── */
        .side-bar {
            position: fixed; right: 15px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px; z-index: 40;
        }
        .ctrl-btn {
            width: 48px; height: 48px; border: 1px solid var(--border);
            background: rgba(10,10,10,0.8); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text); backdrop-filter: blur(10px); transition: 0.3s;
        }
        .ctrl-btn.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 15px var(--accent-dim); }
        .ctrl-btn svg { width: 22px; height: 22px; }

        /* ─── DEPTH SLIDER ─── */
        .depth-box {
            position: fixed; left: 15px; top: 50%; transform: translateY(-50%);
            height: 250px; width: 40px; z-index: 40;
            display: flex; flex-direction: column; align-items: center;
        }
        .track {
            flex: 1; width: 4px; background: var(--border); border-radius: 2px;
            position: relative; margin: 15px 0;
        }
        .fill { position: absolute; bottom: 0; width: 100%; background: var(--accent); border-radius: 2px; }
        .handle {
            position: absolute; left: 50%; transform: translate(-50%, 50%);
            width: 32px; height: 32px; background: #fff; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; color: #000;
            font-weight: 700; font-size: 9px; touch-action: none;
        }

        /* ─── FOOTER ─── */
        footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding-bottom: calc(var(--safe-bottom) + 20px);
            display: flex; justify-content: center; align-items: center;
            gap: 30px; z-index: 50;
        }
        .main-trigger {
            width: 70px; height: 70px; border-radius: 50%;
            background: #fff; border: 4px solid var(--bg);
            box-shadow: 0 0 0 4px #fff; cursor: pointer; transition: 0.2s;
        }
        .main-trigger:active { transform: scale(0.9); }
        .main-trigger.rec { background: var(--danger); box-shadow: 0 0 0 4px var(--danger); }

        .mode-pill {
            background: rgba(20,20,20,0.8); border: 1px solid var(--border);
            padding: 5px; border-radius: 30px; display: flex; backdrop-filter: blur(10px);
        }
        .m-tab {
            padding: 8px 16px; border-radius: 25px; font-size: 10px; font-weight: 700;
            color: rgba(255,255,255,0.4); border: none; background: none;
        }
        .m-tab.active { background: var(--accent); color: var(--bg); }

        /* ─── HUD FX ─── */
        #glitch-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 60;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, transparent 1px, transparent 2px);
            display: none;
        }
        .toast {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: var(--bg); padding: 5px 12px;
            font-weight: 700; font-size: 10px; border-radius: 2px;
            opacity: 0; transition: 0.3s; z-index: 100;
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="loader-logo">my<span>XYZ</span></div>
    <div style="font-size: 10px; letter-spacing: 5px; opacity: 0.5; margin-top: 10px;">NEURAL TOPOGRAPHY</div>
    <button onclick="boot()" style="margin-top: 40px; padding: 15px 40px; background: none; border: 1px solid var(--accent); color: var(--accent); font-family: inherit; letter-spacing: 3px; border-radius: 4px;">INITIALIZE</button>
</div>

<header>
    <div class="sys-log">
        Status: <span id="st">Idle</span><br>
        Resolution: 256x256<br>
        Buffer: <span id="bf">0.0mb</span>
    </div>
    <div class="sys-log" style="text-align: right;">
        FPS: <span id="fps">60</span><br>
        Engine: Three.js r160
    </div>
</header>

<div class="depth-box">
    <div style="font-size: 9px; opacity: 0.5;">DIST</div>
    <div class="track" id="z-track">
        <div class="fill" id="z-fill" style="height: 20%;"></div>
        <div class="handle" id="z-handle" style="bottom: 20%;">1.2</div>
    </div>
    <div style="font-size: 9px; opacity: 0.5;">0.0</div>
</div>

<div class="side-bar">
    <button class="ctrl-btn" id="c-mesh" onclick="toggleMode('mesh')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></button>
    <button class="ctrl-btn" id="c-heat" onclick="toggleMode('heat')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="M9 18l3 3 3-3"/></svg></button>
    <button class="ctrl-btn" id="c-wire" onclick="toggleMode('wire')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
</div>

<div id="container"></div>
<div id="glitch-overlay"></div>
<div class="toast" id="toast">SCAN COMPLETE</div>

<footer>
    <div class="mode-pill">
        <button class="m-tab active" id="m-live" onclick="setView('live')">LIVE</button>
        <button class="m-tab" id="m-3d" onclick="setView('3d')">3D CLOUD</button>
    </div>
    <button class="main-trigger" id="shutter" onclick="capture()"></button>
    <button class="ctrl-btn" onclick="exportIMG()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
</footer>

<video id="v" autoplay playsinline></video>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls, video, videoTex;
let points, mesh;
let state = { z: 1.2, mesh: false, heat: false, wire: false, view: 'live' };

const _VS = `
    varying vec2 vUv;
    varying float vD;
    uniform sampler2D t;
    uniform float uZ;
    void main() {
        vUv = uv;
        vec4 tex = texture2D(t, uv);
        vD = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
        vec3 p = position;
        p.z += vD * uZ;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = uZ > 0.0 ? (2.0 + vD * 4.0) : 2.0;
    }
`;

const _FS = `
    varying vec2 vUv;
    varying float vD;
    uniform sampler2D t;
    uniform bool uH; uniform bool uW;
    void main() {
        vec4 tex = texture2D(t, vUv);
        vec3 c = tex.rgb;
        if(uH) {
            c = mix(vec3(0,0.1,0.5), vec3(0,1,0.4), vD);
            c = mix(c, vec3(1,0,0.2), smoothstep(0.5, 1.0, vD));
        }
        if(uW) {
            float line = step(0.97, fract(vUv.x * 64.0)) + step(0.97, fract(vUv.y * 64.0));
            c += line * vec3(0, 1.0, 0.7);
        }
        gl_FragColor = vec4(c, 1.0);
    }
`;

window.boot = async () => {
    document.getElementById('loader').style.opacity = '0';
    setTimeout(() => document.getElementById('loader').remove(), 800);

    video = document.getElementById('v');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 640, height: 640 } });
    video.srcObject = stream;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('container').appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;
    controls.enableDamping = true;

    videoTex = new THREE.VideoTexture(video);
    const geo = new THREE.PlaneGeometry(12, 12, 200, 200);
    const mat = new THREE.ShaderMaterial({
        uniforms: { t: { value: videoTex }, uZ: { value: state.z }, uH: { value: false }, uW: { value: false } },
        vertexShader: _VS, fragmentShader: _FS, transparent: true
    });

    points = new THREE.Points(geo, mat);
    mesh = new THREE.Mesh(geo, mat.clone());
    mesh.material.side = THREE.DoubleSide;
    mesh.visible = false;
    
    scene.add(points, mesh);
    
    initDepth();
    animate();
    document.getElementById('st').innerText = 'Active';
};

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

// ─── HANDLERS ────────────────────────────────────────────────────────

window.toggleMode = (m) => {
    state[m] = !state[m];
    document.getElementById('c-'+m).classList.toggle('active', state[m]);
    
    if(m === 'mesh') {
        points.visible = !state.mesh;
        mesh.visible = state.mesh;
    } else {
        const key = 'u' + m.charAt(0).toUpperCase();
        points.material.uniforms[key].value = state[m];
        mesh.material.uniforms[key].value = state[m];
    }
};

window.setView = (v) => {
    state.view = v;
    document.querySelectorAll('.m-tab').forEach(t => t.classList.toggle('active', t.id === 'm-'+v));
    controls.enabled = (v === '3d');
    if(v === 'live') {
        camera.position.set(0, 0, 10);
        camera.lookAt(0,0,0);
        points.material.uniforms.t.value = videoTex;
        mesh.material.uniforms.t.value = videoTex;
    }
};

window.capture = async () => {
    const shutter = document.getElementById('shutter');
    const glitch = document.getElementById('glitch-overlay');
    
    shutter.classList.add('rec');
    glitch.style.display = 'block';
    
    await new Promise(r => setTimeout(r, 600));

    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const snapshot = new THREE.CanvasTexture(canvas);

    points.material.uniforms.t.value = snapshot;
    mesh.material.uniforms.t.value = snapshot;
    
    shutter.classList.remove('rec');
    glitch.style.display = 'none';
    setView('3d');
    
    const toast = document.getElementById('toast');
    toast.style.opacity = 1;
    setTimeout(() => toast.style.opacity = 0, 2000);
};

function initDepth() {
    const handle = document.getElementById('z-handle');
    const track = document.getElementById('z-track');
    const fill = document.getElementById('z-fill');

    const update = (y) => {
        const rect = track.getBoundingClientRect();
        let p = 1 - (y - rect.top) / rect.height;
        p = Math.max(0, Math.min(1, p));
        
        state.z = p * 10;
        handle.style.bottom = (p * 100) + '%';
        fill.style.height = (p * 100) + '%';
        handle.innerText = state.z.toFixed(1);
        
        points.material.uniforms.uZ.value = state.z;
        mesh.material.uniforms.uZ.value = state.z;
    };

    handle.addEventListener('touchstart', (e) => {
        const move = (ev) => { update(ev.touches[0].clientY); ev.preventDefault(); };
        window.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('touchend', () => window.removeEventListener('touchmove', move), { once: true });
    });
}

window.exportIMG = () => {
    renderer.render(scene, camera);
    const link = document.createElement('a');
    link.download = `XYZ_DATA_${Date.now()}.png`;
    link.href = renderer.domElement.toDataURL();
    link.click();
};

</script>
</body>
</html>
