    :root {
        --bg: #050505;
        --surface: #0d0d0d;
        --surface2: #141414;
        --accent: #00ffb3;
        --accent-dim: rgba(0, 255, 179, 0.12);
        --accent-glow: rgba(0, 255, 179, 0.35);
        --danger: #ff3c6e;
        --warn: #ffb800;
        --text: #e0e0e0;
        --text-dim: rgba(224, 224, 224, 0.38);
        --border: rgba(255, 255, 255, 0.07);
        --border-accent: rgba(0, 255, 179, 0.25);
        --font-mono: 'JetBrains Mono', monospace;
        --font-sans: 'Syne', sans-serif;
        --blur: blur(20px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
        --header-h: 56px;
        --footer-h: 88px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
        width: 100%; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: var(--font-mono); font-size: 12px;
        user-select: none; touch-action: none;
    }

    /* ─── LOADER ─── */
    #loader {
        position: fixed; inset: 0; z-index: 1000; background: var(--bg);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .loader-logo {
        font-family: var(--font-sans); font-size: clamp(52px, 15vw, 72px);
        font-weight: 800; letter-spacing: -3px; margin-bottom: 8px; line-height: 1;
    }
    .loader-logo span { color: var(--accent); }
    .loader-tag {
        font-size: 10px; color: var(--text-dim); letter-spacing: 4px;
        text-transform: uppercase; margin-bottom: 48px;
    }
    .loader-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .loader-btn {
        padding: 16px 52px; background: transparent; border: 1px solid var(--accent);
        color: var(--accent); font-family: var(--font-mono); font-size: 11px;
        text-transform: uppercase; letter-spacing: 5px; cursor: pointer;
        transition: all 0.3s; border-radius: 2px; min-width: 260px;
    }
    .loader-btn:active { background: var(--accent); color: var(--bg); transform: scale(0.98); }
    .loader-btn.secondary {
        border-color: rgba(255,255,255,0.2); color: var(--text-dim);
        font-size: 10px; letter-spacing: 3px; padding: 13px 40px;
    }
    .loader-btn.secondary:active { background: rgba(255,255,255,0.1); color: var(--text); }

    /* ─── HEADER ─── */
    header {
        position: fixed; top: 0; left: 0; right: 0;
        height: calc(var(--header-h) + var(--safe-top));
        padding-top: var(--safe-top);
        display: flex; align-items: center; justify-content: space-between;
        padding-left: 16px; padding-right: 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(5, 5, 5, 0.75); backdrop-filter: var(--blur); z-index: 20;
    }
    .logo { font-family: var(--font-sans); font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }

    .sys-status { display: flex; align-items: center; gap: 8px; font-size: 9px; letter-spacing: 2px; }
    .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
    .dot.pulse { animation: pulse 2s infinite; }
    .dot.busy { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 0.6s infinite; }

    .meta-info { font-size: 9px; color: var(--text-dim); text-align: right; line-height: 1.6; }

    /* ─── SOURCE BADGE ─── */
    #source-badge {
        position: fixed;
        top: calc(var(--header-h) + var(--safe-top) + 8px);
        right: 12px; z-index: 16;
        display: none; align-items: center; gap: 6px;
        background: rgba(13,13,13,0.9); border: 1px solid var(--border-accent);
        border-radius: 20px; padding: 6px 12px;
        font-size: 9px; letter-spacing: 1.5px; color: var(--accent);
        backdrop-filter: var(--blur);
    }
    #source-badge svg { width: 12px; height: 12px; stroke: var(--accent); flex-shrink: 0; }
    #source-badge.visible { display: flex; }

    /* ─── CONTAINER ─── */
    #container {
        position: fixed; inset: 0;
        top: calc(var(--header-h) + var(--safe-top));
        bottom: calc(var(--footer-h) + var(--safe-bottom));
        background: #000;
    }
    canvas { width: 100%; height: 100%; display: block; }
    video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    /* ─── TOOLBAR & CONTROLS ─── */
    .toolbar {
        position: fixed; left: 12px;
        bottom: calc(var(--footer-h) + var(--safe-bottom) + 12px);
        display: flex; flex-direction: column; gap: 8px; z-index: 15;
    }
    .tool-btn {
        width: 46px; height: 46px; border: 1px solid var(--border);
        background: rgba(13,13,13,0.9); color: var(--text-dim);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        border-radius: 12px; transition: all 0.2s; backdrop-filter: var(--blur);
        position: relative;
    }
    .tool-btn.active { color: var(--accent); border-color: var(--border-accent); background: var(--accent-dim); }
    .tool-btn svg { width: 20px; height: 20px; stroke-width: 2px; }
    .badge {
        position: absolute; top: 0; right: 0; width: 8px; height: 8px;
        background: var(--accent); border-radius: 50%; display: none;
    }
    .badge.visible { display: block; }

    /* ─── UPLOAD BUTTON ─── */
    #btn-upload { border-color: rgba(0,255,179,0.15); }
    #btn-upload:active { background: var(--accent-dim); color: var(--accent); }
    #upload-input { display: none; }

    /* ─── DEPTH SLIDER ─── */
    .depth-ctrl {
        position: fixed; right: 12px;
        bottom: calc(var(--footer-h) + var(--safe-bottom) + 12px);
        z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .depth-track-wrap {
        width: 40px; height: 160px;
        background: rgba(13,13,13,0.9); border: 1px solid var(--border);
        border-radius: 20px; position: relative; touch-action: none;
    }
    .depth-fill {
        position: absolute; bottom: 4px; left: 4px; right: 4px;
        background: var(--accent-dim); border-radius: 16px; transition: height 0.1s;
    }
    .depth-thumb {
        position: absolute; left: 50%; transform: translateX(-50%);
        width: 32px; height: 32px; background: var(--accent);
        border-radius: 50%; box-shadow: 0 0 15px var(--accent-glow);
        pointer-events: none;
    }
    .depth-val { font-size: 11px; color: var(--accent); font-weight: 700; text-shadow: 0 0 5px var(--accent-glow); }

    /* ─── FOOTER ─── */
    footer {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: calc(var(--footer-h) + var(--safe-bottom));
        padding-bottom: var(--safe-bottom);
        display: flex; align-items: center; justify-content: space-between;
        padding-left: 16px; padding-right: 16px;
        background: rgba(5, 5, 5, 0.85); backdrop-filter: var(--blur);
        border-top: 1px solid var(--border); z-index: 20;
    }

        flex: 1; max-width: 220px; height: 56px; margin: 0 10px;

        border: none; border-radius: 28px; font-family: var(--font-mono);
        font-weight: 700; font-size: 11px; letter-spacing: 2px;

    .snap-btn:active { transform: scale(0.96); box-shadow: 0 0 30px var(--accent-glow); }
    .snap-btn.scanning { background: var(--warn); pointer-events: none; }

    .footer-action {
        width: 46px; height: 46px; border: 1px solid var(--border);
        background: transparent; color: var(--text-dim);
        border-radius: 12px; display: flex; align-items: center; justify-content: center;
        cursor: pointer;
    }

    /* ─── MODE PILL ─── */
    .mode-pill {
        position: fixed; top: calc(var(--header-h) + var(--safe-top) + 16px);
        left: 50%; transform: translateX(-50%);
        display: flex; background: rgba(13,13,13,0.9);

    }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls, video, videoTex;
let liveMesh, snapMesh, terrainMesh;
let currentMode = 'live';
let depth = 1.5;
let heatmap = false, wireframe = false;
let ptsCount = 200; // geometry resolution
let imageSource = null; // 'camera' | 'file'
let uploadedImageName = '';

// ─── SHADERS — POINTS ────────────────────────────────────────────────────────
const _VS = `
    varying vec2 vUv;
    varying float vZ;
    uniform sampler2D tDiffuse;
    uniform float uDepth;
    void main() {
        vUv = uv;
        vec4 tex = texture2D(tDiffuse, uv);
        float brightness = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
        vZ = brightness;
        vec3 pos = position;
        pos.z += (brightness - 0.5) * uDepth;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = 2.0;
    }
`;
const _FS = `
    varying vec2 vUv;
    varying float vZ;
    uniform sampler2D tDiffuse;
    uniform bool uHeat;
    uniform bool uWire;
    vec3 getHeat(float v) {
        vec3 c = mix(vec3(0,0,1), vec3(0,1,0), smoothstep(0.0, 0.5, v));
        return mix(c, vec3(1,0,0), smoothstep(0.5, 1.0, v));
    }
    void main() {
        vec4 tex = texture2D(tDiffuse, vUv);
        if(uHeat) {
            gl_FragColor = vec4(getHeat(vZ), 1.0);
        } else if(uWire) {
            gl_FragColor = vec4(0.0, 1.0, 0.7, 1.0);
        } else {
            gl_FragColor = vec4(tex.rgb, 1.0);
        }
    }
`;

// ─── SHADERS — TERRAIN MESH ───────────────────────────────────────────────────
const _TERRAIN_VS = `
    varying vec2 vUv;
    varying float vZ;
    uniform sampler2D tDiffuse;
    uniform float uDepth;
    void main() {
        vUv = uv;
        vec4 tex = texture2D(tDiffuse, uv);
        float brightness = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
        vZ = brightness;
        vec3 pos = position;
        pos.z += (brightness - 0.5) * uDepth;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
`;
const _TERRAIN_FS = `
    varying vec2 vUv;
    varying float vZ;
    uniform sampler2D tDiffuse;
    uniform bool uHeat;
    uniform bool uWire;
    vec3 getHeat(float v) {
        // extended terrain palette: deep→mid→high
        vec3 c0 = vec3(0.0, 0.0, 0.8); // deep blue
        vec3 c1 = vec3(0.0, 0.8, 0.2); // green
        vec3 c2 = vec3(1.0, 0.9, 0.0); // yellow
        vec3 c3 = vec3(1.0, 0.1, 0.0); // peak red
        if(v < 0.33) return mix(c0, c1, v / 0.33);
        if(v < 0.66) return mix(c1, c2, (v - 0.33) / 0.33);
        return mix(c2, c3, (v - 0.66) / 0.34);
    }
    void main() {
        vec4 tex = texture2D(tDiffuse, vUv);
        if(uHeat || true) { // terrain always uses elevation color
            float alpha = uWire ? 0.7 : 1.0;
            vec3 terrainColor = getHeat(vZ);
            if(!uHeat) {
                // blend original texture with elevation tint
                terrainColor = mix(tex.rgb, terrainColor, 0.5);
            }
            gl_FragColor = vec4(terrainColor, alpha);
        }
    }
`;

// ─── INIT ────────────────────────────────────────────────────────────────────
window.initApp = async () => {
    hideLogo();
    imageSource = 'camera';

    try {
        video = document.getElementById('vid');
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment', width: 1024, height: 1024 } 
        });
        video.srcObject = stream;
    } catch(e) {
        showToast("Нет доступа к камере", "warn");
    }

    initThree();
    videoTex = new THREE.VideoTexture(video);
    buildLiveMesh(videoTex);
    initDepthSlider();
    animate();
    showToast("Сенсоры активны", "success");
};

window.triggerUpload = () => {
    document.getElementById('upload-input').click();
};

document.getElementById('upload-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    uploadedImageName = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            loadImageIntoScene(img, file.name);
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = ''; // reset for re-selection
});

function loadImageIntoScene(img, name) {
    if(!scene) {
        // First init from file (no camera)
        hideLogo();
        imageSource = 'file';
        initThree();
        initDepthSlider();
        animate();
    }

    imageSource = 'file';

    // Build canvas texture from image
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    // letterbox / center-crop
    const s = Math.min(canvas.width / img.width, canvas.height / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);

    const tex = new THREE.CanvasTexture(canvas);

    // Build / replace live mesh with this texture
    buildLiveMesh(tex);

    // Update source badge
    const badge = document.getElementById('source-badge');
    const shortName = name.length > 18 ? name.slice(0, 16) + '…' : name;
    document.getElementById('source-name').textContent = shortName;
    badge.classList.add('visible');

    // Switch to live mode to show the image
    setMode('live');
    showToast(`Загружено: ${shortName}`, "success");
}

function hideLogo() {
    const loader = document.getElementById('loader');
    if(loader) {
        loader.style.opacity = 0;
        setTimeout(() => loader.remove(), 700);
    }
}

function initThree() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('container').appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;
    controls.enableDamping = true;

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function buildLiveMesh(tex) {
    if(liveMesh) { scene.remove(liveMesh); liveMesh.geometry.dispose(); liveMesh.material.dispose(); }
    const geo = new THREE.PlaneGeometry(8, 8, ptsCount, ptsCount);
    const mat = new THREE.ShaderMaterial({
        uniforms: {
            tDiffuse: { value: tex },
            uDepth: { value: depth },
            uHeat: { value: heatmap },
            uWire: { value: wireframe }
        },
        vertexShader: _VS, fragmentShader: _FS, transparent: true
    });
    liveMesh = new THREE.Points(geo, mat);
    scene.add(liveMesh);
    videoTex = tex; // keep ref for snapshot
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();

    // FPS approx
    renderer.render(scene, camera);
}

// ─── DEPTH SLIDER ─────────────────────────────────────────────────────────────
function initDepthSlider() {
    const track = document.getElementById('depth-track');
    const thumb = document.getElementById('depth-thumb');
    const fill = document.getElementById('depth-fill');
    const valEl = document.getElementById('depth-val');

    const update = (clientY) => {
        const rect = track.getBoundingClientRect();
        let p = 1 - (clientY - rect.top) / rect.height;
        p = Math.max(0, Math.min(1, p));
        depth = p * 10;
        valEl.innerText = depth.toFixed(1);
        fill.style.height = (p * 100) + '%';
        thumb.style.bottom = `calc(${p * 100}% - 16px)`;
        [liveMesh, snapMesh, terrainMesh].forEach(m => { if(m) m.material.uniforms.uDepth.value = depth; });
    };

    track.addEventListener('touchstart', (e) => update(e.touches[0].clientY));
    track.addEventListener('touchmove', (e) => { e.preventDefault(); update(e.touches[0].clientY); });
    track.addEventListener('mousedown', (e) => {
        update(e.clientY);
        const move = (e2) => update(e2.clientY);
        const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
    });

    // Initial position
    update(track.getBoundingClientRect().bottom - (1.5 / 10) * track.getBoundingClientRect().height);
}

// ─── MODES ────────────────────────────────────────────────────────────────────
window.setMode = (m) => {
    currentMode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-'+m).classList.add('active');

    const legend = document.getElementById('terrain-legend');

    // Visibility
    if(liveMesh) liveMesh.visible = false;
    if(snapMesh) snapMesh.visible = false;
    if(terrainMesh) terrainMesh.visible = false;
    legend.classList.remove('visible');

    controls.enabled = (m !== 'live');

    if(m === 'live') {
        camera.position.set(0,0,5); camera.lookAt(0,0,0);
        if(liveMesh) liveMesh.visible = true;
    } else if(m === 'view') {
        if(snapMesh) snapMesh.visible = true;
        else showToast("Сначала сделайте захват");
    } else if(m === 'terrain') {
        if(terrainMesh) { terrainMesh.visible = true; legend.classList.add('visible'); }
        else showToast("Сначала сделайте захват");
    } else if(m === 'measure') {
        if(snapMesh) snapMesh.visible = true;
        else showToast("Сначала сделайте захват");
        showToast("Режим замеров: тапните по облаку");
    }
};

// ─── SNAPSHOT ─────────────────────────────────────────────────────────────────
window.takeSnapshot = async () => {
    if(!liveMesh) { showToast("Нет источника для захвата"); return; }
    const btn = document.getElementById('snap-btn');
    const fx = document.getElementById('scanner-fx');

    btn.classList.add('scanning');
    btn.innerText = "СКАНИРОВАНИЕ...";
    fx.style.display = 'block';

    await new Promise(r => setTimeout(r, 1500));

    let tex;
    if(imageSource === 'file') {
        // reuse current live mesh texture
        tex = liveMesh.material.uniforms.tDiffuse.value;
    } else {
        // capture from video
        const canvas = document.createElement('canvas');
        canvas.width = 1024; canvas.height = 1024;
        canvas.getContext('2d').drawImage(video, 0, 0);
        tex = new THREE.CanvasTexture(canvas);
    }

    // ── Point cloud snapshot ──
    if(snapMesh) scene.remove(snapMesh);
    const snapMat = liveMesh.material.clone();
    snapMat.uniforms = {
        tDiffuse: { value: tex },
        uDepth: { value: depth },
        uHeat: { value: heatmap },
        uWire: { value: wireframe }
    };
    snapMesh = new THREE.Points(liveMesh.geometry.clone(), snapMat);
    scene.add(snapMesh);

    // ── Terrain mesh ──
    buildTerrainMesh(tex);

    setMode('view');
    btn.classList.remove('scanning');
    btn.innerText = "ЗАХВАТ ОБЪЁМА";
    fx.style.display = 'none';

    showToast("Объект зафиксирован", "success");
    simulateAi();
};

// ─── BUILD TERRAIN ────────────────────────────────────────────────────────────
function buildTerrainMesh(tex) {
    if(terrainMesh) { scene.remove(terrainMesh); terrainMesh.geometry.dispose(); terrainMesh.material.dispose(); }

    // Use fewer segments for solid mesh (performance balance)
    const seg = Math.min(ptsCount, 150);
    const geo = new THREE.PlaneGeometry(8, 8, seg, seg);

    const mat = new THREE.ShaderMaterial({
        uniforms: {
            tDiffuse: { value: tex },
            uDepth: { value: depth },
            uHeat: { value: heatmap },
            uWire: { value: wireframe }
        },
        vertexShader: _TERRAIN_VS,
        fragmentShader: _TERRAIN_FS,
        side: THREE.DoubleSide,
        transparent: true
    });

    terrainMesh = new THREE.Mesh(geo, mat);
    scene.add(terrainMesh);
    terrainMesh.visible = false; // hidden until mode switched
}

// ─── TOGGLES ──────────────────────────────────────────────────────────────────
window.toggleHeatmap = () => {
    heatmap = !heatmap;
    document.getElementById('btn-heat').classList.toggle('active', heatmap);
    [liveMesh, snapMesh, terrainMesh].forEach(m => { if(m) m.material.uniforms.uHeat.value = heatmap; });
};

window.toggleWireframe = () => {
    wireframe = !wireframe;
    document.getElementById('btn-wire').classList.toggle('active', wireframe);
    [liveMesh, snapMesh].forEach(m => { if(m) m.material.uniforms.uWire.value = wireframe; });
    if(terrainMesh) {
        terrainMesh.material.wireframe = wireframe;
        terrainMesh.material.uniforms.uWire.value = wireframe;
    }
};

window.toggleAi = () => {
    const s = document.getElementById('ai-sheet');
    const o = document.getElementById('overlay');
    s.classList.toggle('open');
    o.style.display = s.classList.contains('open') ? 'block' : 'none';
};

function simulateAi() {
    document.getElementById('ai-badge').classList.add('visible');
    document.getElementById('ai-content').innerHTML = `
        <div class="ai-card"><label>Объект</label><p>Обнаружена сложная поверхность. Вероятный тип: "Интерьер/Макро".</p></div>
        <div class="ai-card"><label>Геометрия</label><p>Высокая детализация. Рекомендуется увеличить ГЛУБИНУ до 4.5 для анализа микрорельефа.</p></div>
        <div class="ai-card"><label>Рельеф</label><p>Режим РЕЛЬЕФ доступен. Поверхность сформирована из ${ptsCount * ptsCount / 1000 | 0}K треугольников.</p></div>
        <div class="ai-card"><label>Свет</label><p>Оптимально. Шумы в тенях подавлены программно.</p></div>
    `;
}

window.showToast = (msg, type) => {
    const c = document.getElementById('notifications');
    const t = document.createElement('div');
    t.className = 'toast';
    if(type === 'success') t.style.borderLeftColor = '#00ffb3';
    if(type === 'warn') t.style.borderLeftColor = '#ffb800';
    t.innerText = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
};

window.downloadImage = () => {
    if(!renderer) return;
    renderer.render(scene, camera);
    const link = document.createElement('a');
    link.download = `myXYZ_${Date.now()}.png`;
    link.href = renderer.domElement.toDataURL();
    link.click();
};

</script>
